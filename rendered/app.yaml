apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm
  namespace: vllm-poc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: vllm-poc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: crc-csi-hostpath-provisioner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-tinyllama
  namespace: vllm-poc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: vllm-tinyllama
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: vllm
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: vllm
        image: docker.io/vllm/vllm-openai-cpu@sha256:8024248339dc6878daa5349344ed29d49c8a6732f6bdf7400fda32ce33e4b30b
        imagePullPolicy: IfNotPresent
        command:
        - vllm
        - serve
        args:
        - TinyLlama/TinyLlama-1.1B-Chat-v1.0
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --served-model-name
        - tinyllama
        - --dtype
        - bfloat16
        - --max-model-len
        - '128'
        - --kv-cache-memory-bytes
        - '6291456'
        - --max-num-seqs
        - '1'
        - --max-num-batched-tokens
        - '128'
        - --enforce-eager
        env:
        - name: HOME
          value: /tmp
        - name: HF_HOME
          value: /cache/huggingface
        - name: VLLM_CACHE_ROOT
          value: /cache/vllm
        - name: XDG_CACHE_HOME
          value: /cache
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: nobind
        - name: OMP_NUM_THREADS
          value: '2'
        - name: TOKENIZERS_PARALLELISM
          value: 'false'
        - name: VLLM_NO_USAGE_STATS
          value: '1'
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: '2'
            memory: 6Gi
          limits:
            cpu: '2'
            memory: 6Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        volumeMounts:
        - name: cache
          mountPath: /cache
        - name: shm
          mountPath: /dev/shm
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: model-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-tinyllama
  namespace: vllm-poc
spec:
  selector:
    app: vllm-tinyllama
  ports:
  - name: http
    port: 8000
    targetPort: http
